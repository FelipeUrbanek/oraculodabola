name: Oráculo da Bola - Automação Total

on:
  schedule:
    - cron: '0,30 12,15,21,0 * * *' # Roda exatamente nas janelas de postagem do fuso do Brasil (9:00/9:30, 12:00/12:30, 18:00/18:30, 21:00/21:30 BRT)
  workflow_dispatch: # Permite rodar manualmente

jobs:
  run-oracle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar Dependências
        run: pnpm install

      - name: Instalar Chrome (para Puppeteer)
        run: pnpm exec puppeteer browsers install chrome

      - name: Instalar Dependências do RSSHub
        run: |
          cd rsshub-local
          pnpm install --no-frozen-lockfile

      - name: Iniciar RSSHub Local
        run: |
          cd rsshub-local
          pnpm dev &
          npx wait-on http://localhost:1200
        env:
          ALLOW_USER_SUPPLY_UNSAFE_DOMAIN: true
          PORT: 1200

      - name: Executar Engine do Oráculo (Futebol + Cinema)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          IG_USER_ID_CINEMA: ${{ secrets.IG_USER_ID_CINEMA }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          IS_SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          npx tsx main.ts
          npx tsx main_cinema.ts

      - name: Comitar e Enviar Alterações
        run: |
          git config --global user.name "Oráculo Bot"
          git config --global user.email "bot@ooraculodabola.com"
          git add .
          git commit -m "🔮 Oráculo: Novos posts gerados [$(date +'%Y-%m-%d %H:%M')]" || echo "Nenhuma mudança para comitar"
          git pull --rebase origin main
          git push
